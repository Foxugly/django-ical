name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Redéploiement manuel : le job deploy ne tourne que si la ref est main.
  workflow_dispatch:

# Jeton GitHub en lecture seule par défaut ; seul le job deploy reçoit en plus
# id-token: write (OIDC vers AWS).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # La suite tournait sur SQLite alors que la production tourne sur
    # PostgreSQL 16 (DB_ENGINE=postgresql sur la box). SQLite est plus permissif
    # et laisse passer des requetes que PostgreSQL refuse — c'est ainsi que deux
    # endpoints casses ont vecu en production sur QuizOnline. On teste donc sur
    # le moteur de production. `DATABASE_URL` reste prioritaire dans settings.py,
    # donc les tests clean_import qui pointent un fichier SQLite precis sont
    # inchanges.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PostgreSQL n'est pas un `service` : un service se télécharge avant toute
      # étape, sans cache possible, et le registre refuse parfois (Docker Hub,
      # « Data limit exceeded » sur public.ecr.aws) — la CI échouait avant le
      # moindre test. L'image vit dans le cache d'Actions : un téléchargement par
      # mois au plus, trois tentatives, l'image du mois précédent en secours.
      - name: Clé du cache de l'image PostgreSQL (une par mois)
        id: cle-postgres
        run: echo "mois=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Image PostgreSQL depuis le cache
        id: cache-postgres
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}
          restore-keys: postgres-16-

      - name: Image PostgreSQL depuis le registre (si le cache n'a pas celle du mois)
        id: telechargement-postgres
        if: steps.cache-postgres.outputs.cache-hit != 'true'
        run: |
          for essai in 1 2 3; do
            if docker pull public.ecr.aws/docker/library/postgres:16; then
              docker save public.ecr.aws/docker/library/postgres:16 -o /tmp/postgres-16.tar
              echo "neuve=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((essai * 20))
          done
          if [ -f /tmp/postgres-16.tar ]; then
            echo "::warning::Registre indisponible : image du cache d'un mois précédent."
          else
            echo "::error::Registre indisponible et aucune image en cache."
            exit 1
          fi

      - name: Mettre l'image du mois en cache
        if: steps.telechargement-postgres.outputs.neuve == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/postgres-16.tar
          key: postgres-16-${{ steps.cle-postgres.outputs.mois }}

      - name: Démarrer PostgreSQL 16
        run: |
          docker load -i /tmp/postgres-16.tar
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=ical \
            public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              echo "PostgreSQL prêt."; exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "::error::PostgreSQL ne répond pas."; exit 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Le verrou d'abord (hashes), pour tester exactement les versions que la
      # production installe ; puis les outils de dev, contraints par ce verrou.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt

      # Même installation que deploy/ssm-deploy.sh, dans un venv propre : prouve
      # que le verrou est complet (--no-deps) et cohérent (pip check).
      - name: Lock is complete
        run: |
          python -m venv /tmp/lock-check
          /tmp/lock-check/bin/pip install --quiet --require-hashes --no-deps -r requirements.txt
          /tmp/lock-check/bin/pip check

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          SECRET_KEY: ci-test-key-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: testserver,localhost
          SITE_DOMAIN: localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
          # Convention DB_* 6 variables de la flotte (OPERATIONS.md §3.5).
          DB_ENGINE: postgresql
          DB_NAME: ical
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: pytest -v

  # Audit des dépendances Python contre la base d'avis PyPI (OSV) : le job échoue
  # sur toute vulnérabilité connue. requirements.txt est le verrou haché que la
  # production installe (transitives comprises) ; outil épinglé, cache pip.
  # Exceptions : .pip-audit-ignore, une ligne « ID AAAA-MM-JJ # raison » ;
  # une exception expirée fait échouer le job — à réexaminer, pas à oublier.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pip-audit (version figée)
        run: python -m pip install pip-audit==2.10.1

      - name: Audit des dépendances
        run: |
          ignore=()
          if [ -f .pip-audit-ignore ]; then
            today=$(date -u +%F)
            while read -r id expiry _ || [ -n "$id" ]; do
              case "$id" in ''|'#'*) continue ;; esac
              if [[ ! "$expiry" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::.pip-audit-ignore : date d'expiration manquante pour $id"; exit 1
              fi
              if [[ "$expiry" < "$today" ]]; then
                echo "::error::.pip-audit-ignore : l'exception $id a expiré le $expiry"; exit 1
              fi
              ignore+=(--ignore-vuln "$id")
            done < .pip-audit-ignore
          fi
          # Le verrou de production (hashes) et les outils de dev, audités séparément :
          # pip-audit refuse de mélanger un fichier haché et un fichier qui ne l'est pas.
          pip-audit --progress-spinner off --require-hashes -r requirements.txt "${ignore[@]}"
          pip-audit --progress-spinner off -r requirements-dev.txt "${ignore[@]}"

  # Déploiement en production : uniquement sur un push vers main (ou un
  # lancement manuel sur main), après le succès des tests et de l'audit. Le
  # déclencheur est le push lui-même, dans le même workflow ; aucun événement
  # pull_request ne peut atteindre ce job.
  deploy:
    needs: [test, pip-audit]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # required for OIDC token minting
      contents: read
    # One production deploy at a time: back-to-back merges (e.g. Dependabot
    # auto-merge) queue instead of deploying over each other.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production    # gates the OIDC sub claim AND enables approval rules
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # AWS-RunShellScript runs these as ROOT, in order:
          #   0. root fetches refs/heads/main into its OWN bare mirror
          #      (/var/lib/fleet-deploy, root:root 700) and REFUSES the deploy unless
          #      the deployed SHA is main or an ancestor of main. Nothing is touched
          #      before this check passes.
          #   1. chown tree -> django:www-data (self-heals root-owned git objects
          #      left by manual ops, so the django git reset below can't fail on them).
          #   2. as django, umask 027: fetch + hard-reset to origin/main. The umask
          #      makes every file git recreates be 640/750 (group www-data), killing
          #      the per-deploy world-readable (644) permission drift at the source.
          #   3. as ROOT: install both systemd units straight from the COMMITTED git
          #      blob — never from the django-writable working tree
          #      (closes the cp-unit -> root-RCE escalation). The blob is read from
          #      ROOT'S OWN bare mirror (/var/lib/fleet-deploy, root:root 700), at the
          #      SHA checked in step 0, never from the django-owned .git
          #      (refs/config/hooks there are django-writable).
          #   4. daemon-reload + enable/restart the env-fetch oneshot (repopulates
          #      /run/ical/.env from SSM before the app restarts).
          #   5. as ROOT: install the nginx site config from the COMMITTED git blob,
          #      validate with `nginx -t`, reload ONLY if valid, else restore the prior
          #      config and fail the deploy (the live config is never left broken).
          #   6. as django: ssm-deploy.sh (pip/migrate/collectstatic + restart app via
          #      the tight sudoers grant).
          #   7. FINAL idempotent normalization (root, after everything that writes the
          #      tree): chown then chmod -R g-w,o-rwx -> 750 dirs / 640 files, group
          #      www-data, no other-access, no group-write. g-w,o-rwx preserves +x.
          #      chown -h never follows a symlink django may have planted; the chmod
          #      runs AS DJANGO (root never writes through a django tree, §3.10).
          cat > /tmp/ssm-params.json <<'EOF'
          {
            "commands": [
              "export SHA=${{ github.sha }}",
              "export M=/var/lib/fleet-deploy/django-ical.git",
              "install -d -m 700 -o root -g root /var/lib/fleet-deploy",
              "[ -d $M ] || git init --quiet --bare $M",
              "git --git-dir=$M fetch --quiet --depth=200 https://github.com/Foxugly/django-ical.git refs/heads/main || { echo 'deploy: fetch de main impossible' >&2; exit 1; }",
              "git --git-dir=$M cat-file -e $SHA^{commit} && git --git-dir=$M merge-base --is-ancestor $SHA FETCH_HEAD || { echo \"deploy: $SHA n'appartient pas a l'historique de main, refus\" >&2; exit 1; }",
              "chown -R -h django:www-data /var/www/django_websites/django-ical",
              "sudo -u django bash -c 'umask 027; cd /var/www/django_websites/django-ical && git fetch --quiet && git reset --hard --quiet origin/main'",
              "git --git-dir=$M show $SHA:deploy/ical-env-fetch.service > /etc/systemd/system/ical-env-fetch.service",
              "git --git-dir=$M show $SHA:deploy/ical-gunicorn.service > /etc/systemd/system/ical-gunicorn.service",
              "git --git-dir=$M show $SHA:deploy/fetch-env-from-ssm.sh > /usr/local/sbin/ical-env-fetch.sh && chmod 0755 /usr/local/sbin/ical-env-fetch.sh && chown root:root /usr/local/sbin/ical-env-fetch.sh",
              "systemctl daemon-reload",
              "systemctl enable --quiet ical-env-fetch.service",
              "systemctl restart ical-env-fetch.service",
              "bash -c 'set -e; git --git-dir=$M show $SHA:deploy/nginx/ical.foxugly.com.conf > /etc/nginx/sites-available/ical.foxugly.com.new; cp -a /etc/nginx/sites-available/ical.foxugly.com /etc/nginx/sites-available/ical.foxugly.com.deploybak; mv /etc/nginx/sites-available/ical.foxugly.com.new /etc/nginx/sites-available/ical.foxugly.com; nginx -t || { mv /etc/nginx/sites-available/ical.foxugly.com.deploybak /etc/nginx/sites-available/ical.foxugly.com; exit 1; }; systemctl reload nginx'",
              "sudo -u django bash /var/www/django_websites/django-ical/deploy/ssm-deploy.sh; DEPLOY_RC=$?",
              "chown -R -h django:www-data /var/www/django_websites/django-ical && sudo -u django chmod -R g-w,o-rwx /var/www/django_websites/django-ical",
              "[ $DEPLOY_RC -eq 0 ] || { echo \"deploy: ssm-deploy.sh a echoue (code $DEPLOY_RC)\" >&2; exit $DEPLOY_RC; }"
            ],
            "executionTimeout": ["900"]
          }
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy django-ical ${{ github.sha }}" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "Command ID: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to finish
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          CMD_ID: ${{ steps.ssm.outputs.cmd_id }}
        run: |
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                echo "::endgroup::"
                exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                echo "::group::stdout"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                echo "::endgroup::"
                echo "::group::stderr"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
                echo "::endgroup::"
                exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo "Timed out waiting for SSM command after 15 minutes"
          exit 1
